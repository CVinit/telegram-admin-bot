services:
  api:
    image: ghcr.io/dujiao-next/api:latest
    ports:
      - "8080:8080"

  worker:
    image: ghcr.io/dujiao-next/api:latest
    command: ["./dujiao-next", "worker"]
    depends_on:
      - api

  telegram-admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DUJIAO_BASE_URL: http://api:8080/api/v1
      SQLITE_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data
    depends_on:
      - api
      - worker
