services:
  telegram-admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}"
      DUJIAO_BASE_URL: "${DUJIAO_BASE_URL:?set DUJIAO_BASE_URL, for example https://your-dujiao-domain.com/api/v1}"
      SQLITE_PATH: "${SQLITE_PATH:-/app/data/bot.db}"
      ACTION_CONFIRM_TTL_SECONDS: "${ACTION_CONFIRM_TTL_SECONDS:-300}"
      SESSION_EXPIRE_SKEW_SECONDS: "${SESSION_EXPIRE_SKEW_SECONDS:-60}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - telegram-admin-bot-data:/app/data

volumes:
  telegram-admin-bot-data:
