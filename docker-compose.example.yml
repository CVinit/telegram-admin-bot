services:
  api:
    image: ghcr.io/dujiao-next/api:latest
    ports:
      - "8080:8080"

  telegram-admin-bot:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DUJIAO_BASE_URL: http://api:8080/api/v1
    volumes:
      - ./data:/app/data
    depends_on:
      - api
